<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>55th</title>
    <link rel="icon" href="https://www.svgrepo.com/show/513311/heart.svg" />

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --ink: #1c1a17;
        --paper: #f0ece4;
        --paper-warm: #e8e0d0;
        --accent: #c6922a;
        --accent-deep: #9b4d30;
        --serif: "Playfair Display", Georgia, serif;
        --sans: "Inter", system-ui, sans-serif;
        --page-max: 64rem;
        --gutter: clamp(1.5rem, 4vw, 3rem);
      }

      body {
        background-color: var(--ink);
        color: var(--ink);
        font-family: var(--sans);
        font-weight: 300;
        line-height: 1.75;
        font-size: clamp(0.9rem, 1vw + 0.5rem, 1.05rem);

        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      figure {
        margin: 0;
      }

      img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      ::selection {
        background-color: var(--accent);
        color: var(--paper);
      }

      .magazine {
        max-width: var(--page-max);
        width: 100%;
        background-color: var(--paper);

        border-radius: 0.5rem;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.15),
          0 2px 8px rgba(0, 0, 0, 0.08);

        animation: fadeUp 1.2s ease-out both;
      }

      .hero {
        position: relative;
        min-height: 50vh;
        display: grid;
        grid-template-rows: 1fr auto;
        overflow: hidden;
      }

      .hero__painting {
        position: absolute;
        inset: 0;
        z-index: 0;
      }

      .hero__painting img {
        filter: brightness(0.55) saturate(1.2);
      }

      .hero__overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          transparent 20%,
          rgba(28, 26, 23, 0.85) 70%
        );
        z-index: 1;
      }

      .hero__content {
        position: relative;
        z-index: 2;
        align-self: end;
        padding: var(--gutter);
        padding-bottom: clamp(2rem, 6vw, 4rem);
        color: var(--paper);
        transition:
          transform 0.6s ease,
          opacity 0.6s ease;
      }

      .hero:hover .hero__content {
        transform: translateY(-0.25rem);
      }

      .hero__issue {
        font-size: 0.7rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        opacity: 0.6;
        margin-bottom: 1rem;
      }

      .hero__title {
        font-family: var(--serif);
        font-weight: 900;
        text-shadow: 0 1px 1px rgba(0, 0, 0, 0.25);
        font-size: clamp(3.5rem, 10vw, 8rem);
        line-height: 0.85;
        letter-spacing: -0.03em;
        margin-bottom: 0.75rem;
        text-wrap: balance;
      }

      .hero__subtitle {
        font-family: var(--serif);
        font-weight: 400;
        font-style: italic;
        font-size: clamp(1rem, 2vw, 1.5rem);
        line-height: 1.35;
        max-width: 36ch;
        opacity: 0.85;
        text-wrap: pretty;
      }

      .hero__meta {
        display: flex;
        gap: 2rem;
        margin-top: 1.5rem;
        font-size: 0.7rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        opacity: 0.5;
      }

      .magazine-footer {
        padding: 2rem var(--gutter);
        text-align: center;
        font-size: 0.65rem;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        opacity: 0.3;
        border-top: 1px solid rgba(28, 26, 23, 0.1);
      }

      @media screen and (max-width: 48rem) {
        .intro,
        .split {
          grid-template-columns: 1fr;
        }

        .intro__portrait,
        .split__image {
          min-height: 20rem;
          order: -1;
        }

        .gallery {
          grid-template-columns: 1fr;
        }

        .gallery__item {
          aspect-ratio: 4 / 3;
        }
      }

      @media (max-width: 48rem) {
        body {
          display: block;
          padding: 1.5rem clamp(1rem, 4vw, 1.5rem);
        }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(1.25rem);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>

    <script>
      window.console = window.console || function (t) {};
    </script>
  </head>

  <body translate="no">
    <article class="magazine">
      <header class="hero">
        <figure class="hero__painting">
          <img
            src="https://plus.unsplash.com/premium_photo-1675603849825-483711b5e3a7?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8c21va2UlMjBpbiUyMGJsYWNrfGVufDB8fDB8fHww"
            alt="The Starry Night by Vincent van Gogh, 1889, oil on canvas, Museum of Modern Art, New York"
          />
        </figure>
        <div class="hero__overlay"></div>
        <div class="hero__content">
          <p class="hero__issue">Art &amp; Life</p>
          <h1 class="hero__title">55th</h1>
          <p class="hero__subtitle">
            What we have can never be taken away from us, not even in the worst
            of times.
          </p>
          <div class="hero__meta">
            <span>2021 – 2026</span>
            <span>onto the next one</span>
          </div>
        </div>
      </header>
    </article>
  </body>
</html>
